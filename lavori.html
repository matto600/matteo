<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Con le nostre mani — Prodotti BRUT</title>
<meta name="description" content="La creatività Brut si esprime in mille modi diversi: gioielli, ceramica e oggetti unici nati da uno sguardo fuori margine. Scegliendoli sostieni BRUT.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body class="page-lavori">

<div data-include="header"></div>

<!-- ================= HERO PHOTO ================= -->
<section class="full-photo hero-photo">
  <img src="assets/img/lavori_bowl.png" alt="Ciotola in ceramica BRUT fatta a mano" fetchpriority="high">
</section>

<!-- ================= CON LE NOSTRI MANI ================= -->
<section class="section">
  <div class="container split split--center">
    <div>
      <h1 class="heading">Con le nostri mani</h1>
      <p class="lead">La creatività Brut si esprime in mille modi diversi.
        Ogni oggetto che troverai in questo catalogo nasce da uno sguardo fuori margine,
        da un'idea che sfida le regole. Scegliendolo, contribuisci a sostenere BRUT
        nella sua missione!</p>
      <p class="cta-line">
        <a class="link-u" href="#catalogo">Sfoglia il Catalogo Brut</a>
        <img class="arrow" src="assets/img/PaginaArtbrut__sito-12.png" alt="">
      </p>
    </div>
    <div class="media-ink">
      <img src="assets/img/PaginaLavori__sito-13.png" alt="">
    </div>
  </div>
</section>

<!-- nota manoscritta -->
<div class="container falsificato-wrap"><img class="note-falsificato" src="assets/img/PaginaArtbrut__sito-09.png" alt="Con l'orario falsificato"></div>

<!-- ================= SHOWCASE ================= -->
<section class="section showcase" id="catalogo">
  <div class="container">
    <div class="showcase__grid">
      <figure class="product">
        <img src="assets/img/lavori_gioielli.png" alt="Gioielli fatti a mano BRUT">
      </figure>
      <figure class="product">
        <img src="assets/img/lavori_ceramica2.png" alt="Ceramica decorata BRUT">
      </figure>
    </div>
  </div>
</section>

<!-- ================= CLAIM ================= -->
<section class="section claim claim--center">
  <div class="container">
    <img class="claim__img" src="assets/img/HomePage__sito-14.png" alt="La normalità è sopravvalutata">
  </div>
</section>

<div data-include="footer"></div>

<script src="js/lenis.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>

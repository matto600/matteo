name: Deploy sito BRUT (FTP)

# Auto-deploy: a ogni push sul branch di lavoro (o su main) il sito viene
# sincronizzato via FTP sull'hosting. Carica SOLO i file cambiati, quindi
# niente piu' "Update" manuale su cPanel e niente errori ogni due deploy.
# Il passo FTP viene ritentato fino a 3 volte: l'FTP ogni tanto va in
# timeout sul control socket, il retry rende il deploy affidabile.
# Si puo' anche lanciare a mano da GitHub -> Actions -> "Run workflow".

on:
  push:
    branches:
      - main
      - claude/wizardly-maxwell-5e48ao
  workflow_dispatch:

concurrency:
  # Se arrivano piu' push ravvicinati, tiene solo l'ultimo deploy.
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Tentativo 1 ---
      - name: Sync via FTP (1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.devs4.it
          username: brut@devs4.it
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/work/**
            **/assets_src/**
            **/tools/**
            **/.claude/**
            **/*.md
            .cpanel.yml
            shot.js
            of.js
            of2.js
            package.json
            package-lock.json
            brut-site.zip

      # --- Tentativo 2 (solo se il 1 fallisce) ---
      - name: Sync via FTP (2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.devs4.it
          username: brut@devs4.it
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/work/**
            **/assets_src/**
            **/tools/**
            **/.claude/**
            **/*.md
            .cpanel.yml
            shot.js
            of.js
            of2.js
            package.json
            package-lock.json
            brut-site.zip

      # --- Tentativo 3 (solo se anche il 2 fallisce): questo fa fallire
      #     il job se non riesce, cosi' vedi lo stato rosso. ---
      - name: Sync via FTP (3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.devs4.it
          username: brut@devs4.it
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/work/**
            **/assets_src/**
            **/tools/**
            **/.claude/**
            **/*.md
            .cpanel.yml
            shot.js
            of.js
            of2.js
            package.json
            package-lock.json
            brut-site.zip
